name: Deploy

# Manual, hands-off deploy — no local toolchain needed. Trigger from the
# GitHub Actions tab ("Run workflow") and pick what to deploy.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        # `none` runs no deploy at all, for runs that only use the optional
        # steps below (a backup, a moderator grant) — useful when billing is
        # down and any deploy would fail.
        options: [all, functions, hosting, none]
      grant_moderator_email:
        description: "Optional: grant this email the moderator claim (admin portal access)"
        type: string
        default: ""
      seed_demo_email:
        description: "Optional: seed demo matches + a chat for this member email (screenshots)"
        type: string
        default: ""
      clear_demo_email:
        description: "Optional: REMOVE the seeded demo members/matches/chat for this member email"
        type: string
        default: ""
      add_sha1:
        description: "Optional: register this SHA-1 fingerprint on the Firebase Android app"
        type: string
        default: ""
      add_sha256:
        description: "Optional: register this SHA-256 fingerprint on the Firebase Android app"
        type: string
        default: ""
      approve_member_email:
        description: "Optional: moderator override — approve this member email (rescind a prior rejection)"
        type: string
        default: ""
      set_gender_email:
        description: "Optional: correct a member's gender (with set_gender_value)"
        type: string
        default: ""
      set_gender_value:
        description: "Optional: male|female — the gender to set for set_gender_email"
        type: string
        default: ""
      backup:
        description: "Optional: set to true to dump Firestore + Auth users to a private artifact (contains personal data)"
        type: string
        default: ""
      scaffold_ios:
        description: "Optional: set to true to generate the ios/ platform folder as an artifact"
        type: string
        default: ""
      ios_build:
        description: "Optional: set to true to run an unsigned iOS compile check on macOS"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: ikhlas-caecf
  # Match the version the apps' pubspec.lock files were resolved with
  # (sdks: flutter >=3.38.4). Older Flutter can't satisfy cloud_functions.
  FLUTTER_VERSION: 3.38.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Firebase
        # Add a repo secret FIREBASE_SERVICE_ACCOUNT with a service-account JSON
        # that has Firebase Admin, Cloud Functions Admin, Cloud Run Admin,
        # Service Account User and Secret Manager Accessor roles.
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Check billing state
        # Cloud Functions v2 run on Cloud Run, which REQUIRES billing. When
        # billing lapses, every endpoint returns a Google Frontend 500/503 and
        # the deploy dies on an unrelated-looking Secret Manager 403 — the same
        # outage has now happened twice and both times cost an hour to trace.
        # This states the cause up front. Diagnostic only: it never fails the
        # run, so a missing permission or API can't block a deploy.
        continue-on-error: true
        run: |
          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet 2>/dev/null || {
              echo "::warning::Could not authenticate gcloud; skipping the billing check."; exit 0; }
          TOKEN=$(gcloud auth print-access-token 2>/dev/null) || {
              echo "::warning::Could not mint an access token; skipping the billing check."; exit 0; }
          OUT=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://cloudbilling.googleapis.com/v1/projects/$PROJECT/billingInfo" || true)
          echo "$OUT"
          # billingEnabled is omitted (not `false`) by the JSON API when billing
          # is off, so treat anything other than an explicit true as disabled.
          ENABLED=$(echo "$OUT" | jq -r '.billingEnabled // false' 2>/dev/null || echo unknown)
          ACCOUNT=$(echo "$OUT" | jq -r '.billingAccountName // ""' 2>/dev/null || echo "")
          if [ "$ENABLED" = "true" ]; then
            echo "Billing ENABLED on $PROJECT (account: ${ACCOUNT:-unknown})."
          elif echo "$OUT" | grep -qi '"error"'; then
            echo "::warning::Billing state could not be read (see the response above). Not necessarily a problem."
          else
            echo "::error::BILLING IS DISABLED on $PROJECT. Every Cloud Function will return 500/503 and this deploy will fail on a Secret Manager 403. Re-link a billing account at https://console.cloud.google.com/billing/linkedaccount?project=$PROJECT — the existing functions recover on their own once billing is back, with no redeploy needed."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Back up Firestore + Auth (optional)
        # Logical backup via the Admin SDK rather than `gcloud firestore
        # export`, because the managed export needs billing enabled — the very
        # thing that is broken when a backup matters most. Firestore and Auth
        # keep serving on their free quotas while billing is suspended.
        if: ${{ inputs.backup == 'true' }}
        working-directory: app/functions
        env:
          GCLOUD_PROJECT: ${{ env.PROJECT }}
        run: |
          npm ci
          node scripts/backup-all.js "$RUNNER_TEMP/backup"

      - name: Upload backup artifact (optional)
        # always() so the backup still reaches you if a later deploy step fails
        # (which it will, while billing is down).
        if: ${{ always() && inputs.backup == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ikhlaas-backup
          path: ${{ runner.temp }}/backup
          if-no-files-found: error
          # Short window on purpose: this contains member profiles, messages
          # and ID-verification state. Download it, store it securely, and let
          # the artifact expire.
          retention-days: 3

      - name: Grant moderator claim (optional)
        # Directly sets the `moderator:true` custom claim (and seeds the
        # config/moderators allowlist) for the email passed as a run input,
        # using the service account. The email is a workflow input, never
        # committed to the repo. Run this workflow with the field filled in.
        if: ${{ inputs.grant_moderator_email != '' }}
        working-directory: app/functions
        env:
          GRANT_EMAIL: ${{ inputs.grant_moderator_email }}
          GCLOUD_PROJECT: ${{ env.PROJECT }}
        run: |
          npm ci
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp();
            (async () => {
              const email = String(process.env.GRANT_EMAIL || "").trim().toLowerCase();
              if (!email) { console.log("no email"); return; }
              const u = await admin.auth().getUserByEmail(email);
              const claims = { ...(u.customClaims || {}), moderator: true };
              await admin.auth().setCustomUserClaims(u.uid, claims);
              await admin.auth().revokeRefreshTokens(u.uid);
              await admin.firestore().doc("config/moderators")
                .set({ emails: admin.firestore.FieldValue.arrayUnion(email) }, { merge: true });
              console.log("moderator granted:", email, u.uid);
            })().catch((e) => { console.error(e.message || e); process.exit(1); });
          '

      - name: Set member gender (optional)
        # Moderator correction of a member's gender. Email + value are run
        # inputs, not committed.
        if: ${{ inputs.set_gender_email != '' }}
        working-directory: app/functions
        env:
          SET_GENDER_EMAIL: ${{ inputs.set_gender_email }}
          SET_GENDER_VALUE: ${{ inputs.set_gender_value }}
        run: |
          npm ci
          node scripts/set-gender.js

      - name: Approve member (optional)
        # Moderator override — approve a member by email (rescinds a prior gate
        # rejection). Email is a run input, not committed.
        if: ${{ inputs.approve_member_email != '' }}
        working-directory: app/functions
        env:
          APPROVE_MEMBER_EMAIL: ${{ inputs.approve_member_email }}
        run: |
          npm ci
          node scripts/approve-member.js

      - name: Register SHA fingerprint (optional)
        # Adds SHA-1/SHA-256 to the Firebase Android app via the Firebase
        # Management API (Google Sign-In authorizes builds signed with that
        # key). Fingerprints are run inputs, not committed. Idempotent.
        if: ${{ inputs.add_sha1 != '' || inputs.add_sha256 != '' }}
        working-directory: app/functions
        env:
          SHA1: ${{ inputs.add_sha1 }}
          SHA256: ${{ inputs.add_sha256 }}
        run: |
          npm ci
          node scripts/add-sha.js

      - name: Clear demo matches + chat (optional)
        # Removes the seeded screenshot data (demo_* ids / {demo:true} flags)
        # so no fabricated profiles remain in the live matching pool.
        if: ${{ inputs.clear_demo_email != '' }}
        working-directory: app/functions
        env:
          CLEAR_DEMO_EMAIL: ${{ inputs.clear_demo_email }}
        run: |
          npm ci
          node scripts/clear-demo.js

      - name: Seed demo matches + chat (optional)
        # Writes demo match entries + a live conversation for the given member
        # email so Play Store screenshots show real content. Demo data only
        # (ids prefixed demo_); safe to delete afterwards.
        if: ${{ inputs.seed_demo_email != '' }}
        working-directory: app/functions
        env:
          SEED_DEMO_EMAIL: ${{ inputs.seed_demo_email }}
        run: |
          npm ci
          node scripts/seed-demo.js

      - name: Deploy functions + rules
        if: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
        working-directory: app
        run: |
          ( cd functions && npm ci )
          set +e
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes,storage \
            --project "$PROJECT" --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          CODE=${PIPESTATUS[0]}
          set -e
          # A lapsed billing account surfaces as a Secret Manager 403 deep in the
          # log, which reads like a permissions problem and is not. Name it.
          if [ "$CODE" -ne 0 ] && grep -qi 'requires billing to be enabled' "$RUNNER_TEMP/deploy.log"; then
            echo "::error::Deploy failed because BILLING IS DISABLED on $PROJECT, not because of the code or the service-account permissions. Re-link a billing account at https://console.cloud.google.com/billing/linkedaccount?project=$PROJECT, then re-run."
          fi
          exit "$CODE"

      - uses: subosito/flutter-action@v2
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' || inputs.scaffold_ios == 'true' }}
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Generate the iOS platform folder (optional)
        # The project was created Android-only, so there is no ios/ directory.
        # `flutter create` writes the platform templates (no Xcode needed); we
        # publish them as an artifact to be committed deliberately rather than
        # auto-pushed from CI.
        if: ${{ inputs.scaffold_ios == 'true' }}
        working-directory: app
        run: |
          flutter create --platforms=ios --org io.ikhlaas .
          echo "--- generated ---"
          find ios -maxdepth 2 -type f | sort

      - name: Upload iOS scaffold artifact (optional)
        if: ${{ inputs.scaffold_ios == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-scaffold
          path: app/ios
          if-no-files-found: error
          retention-days: 7

      - name: Configure Android release signing
        # Writes the release keystore + key.properties from repo secrets so the
        # member APK is signed with a STABLE key whose SHA-1/256 is registered
        # in Firebase (required for Google Sign-In). Absent secret → falls back
        # to the debug key (build still succeeds; Google Sign-In won't).
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — release APK uses the debug key; Google Sign-In will fail."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Release signing configured."

      - name: Build admin web + member APK + Play AAB
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' }}
        run: |
          ( cd admin && flutter pub get && flutter build web --release )
          ( cd app && flutter pub get && flutter build apk --release )
          cp app/build/app/outputs/flutter-apk/app-release.apk admin/build/web/ikhlas.apk
          # Signed App Bundle for the Play Store (Play requires .aab, not .apk).
          ( cd app && flutter build appbundle --release )

      - name: Upload Play AAB artifact
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' }}
        uses: actions/upload-artifact@v4
        with:
          name: ikhlaas-playstore-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build wali portal web
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' }}
        run: ( cd wali && flutter pub get && flutter build web --release )

      - name: Deploy hosting
        if: ${{ inputs.target == 'all' || inputs.target == 'hosting' }}
        run: firebase deploy --only hosting --project "$PROJECT" --non-interactive

  # Unsigned iOS compile check. Separate job because it needs a macOS runner —
  # gated on an input so it never burns macOS minutes on a normal deploy.
  # Requires app/ios to exist (see the scaffold_ios step above).
  ios:
    if: ${{ inputs.ios_build == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build iOS (no codesign)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
